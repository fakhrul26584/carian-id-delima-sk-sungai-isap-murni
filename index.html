<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cari ID DELIMa — SK Sungai Isap Murni</title>
<style>
:root{--navy:#0b1f3a;--blue:#1769aa;--gold:#d6a84f;--bg:#f4f7fb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eef3f9,#fff);color:#182536}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
.card{width:min(760px,100%);background:#fff;border:1px solid #e6ebf2;border-radius:24px;box-shadow:0 20px 60px #10243a18;overflow:hidden}
.hero{background:linear-gradient(135deg,var(--navy),#173f69);color:#fff;padding:34px 34px 30px}
.badge{display:inline-block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border:1px solid #ffffff3b;border-radius:999px;padding:7px 11px;margin-bottom:15px}
h1{margin:0;font-size:clamp(26px,5vw,40px);line-height:1.1} .sub{margin:10px 0 0;color:#dbe7f4}
.body{padding:30px 34px 34px}.label{font-weight:700;font-size:14px;margin-bottom:9px}
.search{display:flex;gap:10px}.search input{flex:1;border:1px solid #d7dee8;border-radius:13px;padding:15px 16px;font-size:16px;outline:none}.search input:focus{border-color:var(--blue);box-shadow:0 0 0 4px #1769aa15}
button{border:0;border-radius:13px;padding:0 20px;font-weight:800;cursor:pointer;background:var(--blue);color:#fff}
.hint{font-size:12px;color:#6d7887;margin-top:9px}.results{margin-top:22px}.empty{padding:20px;border-radius:15px;background:#f7f9fc;color:#687586;text-align:center}
.result{border:1px solid #e3e8ef;border-radius:18px;padding:20px;margin-top:10px}.rname{font-size:18px;font-weight:800}.meta{font-size:13px;color:#6b7785;margin-top:4px}.idrow{display:flex;align-items:center;gap:10px;background:#f5f8fc;border-radius:13px;padding:12px 13px;margin-top:15px}.id{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:17px;font-weight:800;letter-spacing:.04em;flex:1;word-break:break-all}.copy{height:42px;background:#182536;padding:0 15px}.count{text-align:center;margin-top:20px;font-size:12px;color:#8993a0}
footer{text-align:center;margin-top:18px;font-size:11px;color:#8792a0}
@media(max-width:560px){.wrap{padding:12px}.hero,.body{padding:24px}.search{flex-direction:column}.search button{height:50px}.idrow{align-items:stretch;flex-direction:column}.copy{height:44px}}
</style>
</head>
<body>
<div class="wrap"><main class="card">
<section class="hero"><div class="badge">Sistem Dalaman Sekolah</div><h1>Cari ID DELIMa</h1><p class="sub">SK Sungai Isap Murni, Kuantan</p></section>
<section class="body">
<div class="label">Nama murid</div>
<div class="search"><input id="q" autocomplete="off" placeholder="Taip nama murid..." autofocus><button onclick="search()">CARI</button></div>
<div class="hint">Carian boleh menggunakan sebahagian nama.</div>
<div id="results" class="results"><div class="empty">Taip nama murid untuk mula mencari.</div></div>
<div id="count" class="count"></div>
<footer>Data DELIMa • Kemaskini: Ogos 2026</footer>
</section></main></div>
<script>
let data=[];
fetch('/data/murid.json').then(r=>r.json()).then(x=>{data=x;document.getElementById('count').textContent=`${x.length} rekod murid dimuatkan`;});
const q=document.getElementById('q'); q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});
function search(){
 const term=q.value.trim().toLowerCase(), box=document.getElementById('results');
 if(!term){box.innerHTML='<div class="empty">Sila masukkan nama murid.</div>';return}
 const hits=data.filter(r=>r.name.toLowerCase().includes(term)).slice(0,30);
 if(!hits.length){box.innerHTML='<div class="empty">Tiada murid dijumpai. Cuba ejaan atau nama yang lain.</div>';return}
 box.innerHTML=hits.map((r,i)=>`<div class="result"><div class="rname">${esc(r.name)}</div><div class="meta">${esc(r.class)}</div><div class="idrow"><div class="id">${esc(r.id)}</div><button class="copy" onclick="copyId('${escAttr(r.id)}',this)">COPY ID</button></div></div>`).join('');
}
function copyId(id,b){navigator.clipboard.writeText(id).then(()=>{let t=b.textContent;b.textContent='COPIED ✓';setTimeout(()=>b.textContent=t,1300)})}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function escAttr(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
</script>
</body></html>
