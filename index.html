<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b2340">
<title>Sistem Carian ID DELIMa | SK Sungai Isap Murni</title>
<style>
:root{--navy:#0b2340;--navy2:#123b62;--gold:#d4ad62;--ink:#142235;--muted:#6b7888;--line:#e4e9ef;--bg:#f4f7fa;--blue:#176aa6}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0%,#e6f0fb 0,transparent 30%),radial-gradient(circle at 100% 0%,#f3e9fb 0,transparent 32%),var(--bg);min-height:100vh}
.shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}.card{width:min(820px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 24px 70px #0b234022}
.top{position:relative;padding:38px 42px 34px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}.top:after{content:"";position:absolute;width:210px;height:210px;border:1px solid #ffffff18;border-radius:50%;right:-70px;top:-100px;box-shadow:0 0 0 28px #ffffff06,0 0 0 58px #ffffff04}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#e7d09d;font-weight:800}.title{font-size:clamp(28px,5vw,43px);font-weight:850;letter-spacing:-.03em;margin:9px 0 5px}.school{font-size:15px;color:#dbe6f2}.goldline{width:58px;height:3px;background:var(--gold);margin-top:20px;border-radius:3px}
.body{padding:34px 42px 38px}.notice{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:14px;background:#f5f8fc;border:1px solid #e9eef4;font-size:13px;color:#586678;margin-bottom:24px}.notice b{color:var(--ink)}
label{font-size:13px;font-weight:800;display:block;margin-bottom:8px}.field{display:flex;gap:10px}.field input{flex:1;min-width:0;border:1px solid #d5dde7;border-radius:13px;padding:15px 16px;font-size:16px;outline:none}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 4px #176aa614}.btn{border:0;border-radius:13px;background:var(--blue);color:#fff;font-weight:850;padding:0 23px;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.small{font-size:11px;color:#8a95a2;margin-top:8px}.status{min-height:20px;margin-top:16px;font-size:13px}.results{margin-top:4px}.result{border:1px solid var(--line);border-radius:18px;padding:19px 20px;margin-top:11px;background:#fff}.name{font-size:17px;font-weight:850}.class{font-size:12px;color:var(--muted);margin-top:4px}.idbox{display:flex;align-items:center;gap:10px;margin-top:14px;background:#f5f8fb;border:1px solid #e9eef3;border-radius:13px;padding:10px 11px}.id{flex:1;font:800 17px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.05em;word-break:break-all}.copy{height:40px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:800;padding:0 14px;cursor:pointer}.empty{text-align:center;padding:25px 12px;color:#778392;background:#f8fafc;border-radius:15px}.footer{text-align:center;font-size:10px;color:#99a3ae;margin-top:25px}
@media(max-width:600px){.shell{padding:12px}.top{padding:28px 25px}.body{padding:25px}.field{flex-direction:column}.btn{height:50px}.idbox{flex-direction:column;align-items:stretch}.copy{width:100%}}
</style>
</head>
<body>
<div class="shell"><main class="card">
<header class="top"><div class="kicker">Portal Dalaman Sekolah</div><div class="title">Sistem Carian ID DELIMa</div><div class="school">SK Sungai Isap Murni, Kuantan</div><div class="goldline"></div></header>
<section class="body">
<div class="notice">🔐 <span><b>Akses guru.</b> Masukkan access code sekolah sebelum membuat carian.</span></div>
<label for="code">Access Code</label>
<div class="field"><input id="code" type="password" placeholder="Masukkan access code"><button class="btn" id="unlock">AKSES</button></div>
<div id="searchArea" style="display:none;margin-top:25px">
<label for="q">Nama murid</label>
<div class="field"><input id="q" placeholder="Taip nama murid..." autocomplete="off"><button class="btn" id="go">CARI</button></div>
<div class="small">Carian boleh menggunakan sebahagian nama. Maksimum 30 padanan dipaparkan.</div>
<div id="status" class="status"></div><div id="results" class="results"></div>
</div>
<div class="footer">Data DELIMa • Kemaskini Ogos 2026 • SK Sungai Isap Murni</div>
</section></main></div>
<script>
let accessCode="";
const code=document.getElementById("code"), unlock=document.getElementById("unlock"), area=document.getElementById("searchArea"), q=document.getElementById("q"), go=document.getElementById("go"), status=document.getElementById("status"), results=document.getElementById("results");
unlock.onclick=()=>{accessCode=code.value.trim(); if(!accessCode){alert("Sila masukkan access code.");return} area.style.display="block"; code.disabled=true; unlock.disabled=true; q.focus()};
code.addEventListener("keydown",e=>{if(e.key==="Enter")unlock.click()});
go.onclick=search; q.addEventListener("keydown",e=>{if(e.key==="Enter")search()});
async function search(){
 const term=q.value.trim(); if(term.length<2){status.textContent="Masukkan sekurang-kurangnya 2 aksara.";results.innerHTML="";return}
 go.disabled=true;status.textContent="Mencari…";results.innerHTML="";
 try{
  const r=await fetch("/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:accessCode,q:term})});
  const d=await r.json(); if(!r.ok)throw new Error(d.error||"Carian gagal.");
  status.textContent=d.total?`${d.total} padanan dijumpai.`:"Tiada padanan.";
  results.innerHTML=d.results.map(x=>`<article class="result"><div class="name">${esc(x.name)}</div><div class="class">${esc(x.class)}</div><div class="idbox"><div class="id">${esc(x.id)}</div><button class="copy" onclick="copyId('${attr(x.id)}',this)">COPY ID</button></div></article>`).join("") || '<div class="empty">Tiada murid dijumpai. Cuba nama yang lain.</div>';
 }catch(e){status.textContent=e.message}
 go.disabled=false;
}
function copyId(id,b){navigator.clipboard.writeText(id).then(()=>{const t=b.textContent;b.textContent="COPIED ✓";setTimeout(()=>b.textContent=t,1300)})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
function attr(s){return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'")}
</script>
</body></html>
